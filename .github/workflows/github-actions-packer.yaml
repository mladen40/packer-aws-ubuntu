---

name: AWS AMI using Packer

on:
  push:
    branches:
      - master
  # schedule:
  #   - cron: '45 0 7 * *'

env:
  PACKER_VERSION: "latest"
  AWS_REGION: us-west-2

jobs:
  packer:
    runs-on: ubuntu-latest
    name: Build AMI
    permissions:
      contents: read
      id-token: write  # Required for OIDC if you switch to OIDC auth later

    outputs:
      ami_id: ${{ steps.build.outputs.ami_id }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Packer Init
        run: packer init ./aws-demo.pkr.hcl

      - name: Packer Validate
        run: packer validate ./aws-demo.pkr.hcl

      - name: Packer Build
        id: build
        run: |
          set -e
          packer build ./aws-demo.pkr.hcl
          if [ -f packer-manifest.json ]; then
            ami_id=$(jq -r '.builds[-1].artifact_id | split(":") | .[1]' packer-manifest.json)
            echo "ami_id=$ami_id" >> $GITHUB_OUTPUT
            echo "Built AMI: $ami_id"
          fi
